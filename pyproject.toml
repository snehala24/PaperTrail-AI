[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "papertrail-ai"
version = "0.1.0"
description = "Multi-paper research evidence workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pymupdf>=1.23.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=2.5.0",
    "faiss-cpu>=1.7.4",
    "torch>=2.0.0",
    "google-genai>=1.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
